name: get_ar_aging_summary
version: 1
kind: query
permission: ar.read
description: >
  Accounts receivable aging: open balances split into Current, 1-30, 31-60, 61-90 and 90+ days
  past due, as of a date, grouped by customer, region or segment.
parameters:
  - name: as_of_date
    type: date
    as_of: true
    default: today
    description: Report date (YYYY-MM-DD). Defaults to today. Cannot be in the future.
  - name: group_by
    type: enum
    values: [region, customer, segment]
    default: region
    description: How to group the rows.
  - name: limit
    type: integer
    min: 1
    max: 100
    default: "20"
    description: Maximum number of groups to return (largest open balance first).
  - name: region
    type: region
    description: Optional region filter. Omit for all regions you can access.
definitions: [open_balance, aging_buckets, excludes_void_credited, currency, totals_shown_rows]
query: ar_aging_summary.sql
output:
  columns:
    - { name: group_label,    type: string, untrusted: true }
    - { name: current_amount, type: money, unit: USD }
    - { name: days_1_30,      type: money, unit: USD }
    - { name: days_31_60,     type: money, unit: USD }
    - { name: days_61_90,     type: money, unit: USD }
    - { name: days_90_plus,   type: money, unit: USD }
    - { name: total_open,     type: money, unit: USD }
  totals: [current_amount, days_1_30, days_31_60, days_61_90, days_90_plus, total_open]
